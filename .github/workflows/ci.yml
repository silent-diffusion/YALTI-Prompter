name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: resources/models/en-us
          key: speech-model-${{ hashFiles('scripts/fetch-model.mjs') }}

      - name: Download and verify speech model
        run: npm run fetch-model

      - name: Check dependency licenses
        run: npm run check-licenses

      - name: Unit tests
        run: npm test

      - name: Speech tests (real recognition of synthesized speech)
        # Uses the built-in Windows voices; skipped automatically where unavailable.
        run: npm run test:speech
        continue-on-error: true

      - name: Package (unpacked)
        run: npm run pack

      - name: Build the installer (compiles build/installer.nsh)
        run: npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never
