name: Release

# Push a tag like v1.2.3 (matching package.json) to build Windows installers
# and attach them to a draft GitHub release for review — or run this workflow
# on main from the Actions tab, which tags the commit v<package.json version>
# itself first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Download and verify speech model
        run: npm run fetch-model

      - name: Check dependency licenses
        run: npm run check-licenses

      - name: Unit tests
        run: npm test

      - name: Tag this commit (when started from the Actions tab)
        # The tag must exist before the draft is published: if publishing created
        # it, that tag would start this workflow again and replace the checksums.
        # Tags pushed with GITHUB_TOKEN don't start workflows, so this one doesn't.
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Start releases from main (this run is on $GITHUB_REF)."
            exit 1
          fi
          tag="v$(node -p "require('./package.json').version")"
          git fetch --quiet --tags origin
          existing=$(git rev-list -n 1 "$tag" 2>/dev/null || true)
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "$tag already points at this commit."
          elif [ -n "$existing" ]; then
            echo "::error::$tag already exists on another commit. Bump the version in package.json first."
            exit 1
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" -m "YALTI Prompter ${tag#v}"
            git push origin "$tag"
          fi

      - name: Build installer, portable app and zip; publish draft release
        # The release goes to the repository this workflow runs in. Bash, because
        # PowerShell splits "-c.publish.repo=…" arguments at the dot.
        shell: bash
        run: npx electron-builder --win --publish always "-c.publish.owner=$OWNER" "-c.publish.repo=$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}

      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Out-File -Encoding utf8 dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attach checksums to the release
        # The release's tag is v<package.json version> (checked or created above).
        shell: bash
        run: gh release upload "v$(node -p "require('./package.json').version")" dist/SHA256SUMS.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yalti-prompter-windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
