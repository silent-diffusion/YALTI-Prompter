name: Feature idea
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation or problem first — what are you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could YALTI help? Keep in mind the goals of minimalism, privacy and offline use.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
