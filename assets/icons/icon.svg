<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e9ee"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#121216"/>
    </linearGradient>
    <clipPath id="clip"><rect x="40" y="40" width="944" height="944" rx="216"/></clipPath>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <!-- The island flowing out of the top edge, with liquid shoulders. -->
