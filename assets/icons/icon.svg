    <rect x="300" y="250" width="424" height="58" rx="29" fill="#ffd166"/>
    <rect x="300" y="362" width="340" height="50" rx="25" fill="#ffffff" fill-opacity="0.88"/>
    <rect x="300" y="456" width="250" height="44" rx="22" fill="#ffffff" fill-opacity="0.45"/>
  </g>
  <!-- Faint lines on the "screen" below, the rest of the script. -->
  <rect x="300" y="680" width="424" height="40" rx="20" fill="#0b0b0d" fill-opacity="0.12"/>
  <rect x="300" y="770" width="330" height="40" rx="20" fill="#0b0b0d" fill-opacity="0.08"/>
